services:
  app:
    build:
      context: ../..
      dockerfile: runtime/hml/Dockerfile
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
    environment:
      MODULOS_HML_ENABLED: '1'
      HML_ADMIN_EMAIL: vitrineiapro@gmail.com
      HML_ADMIN_PASSWORD: ${HML_ADMIN_PASSWORD:-}
      HML_SECURE_COOKIE: ${HML_SECURE_COOKIE:-1}
    volumes:
      - modulos_hml_data:/data
    networks: [internal]
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
  web:
    image: nginx:1.28-alpine
    container_name: modulos_sprint2_hml_web
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
    networks: [internal, proxy]
    expose: ['8080']
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/healthz']
      interval: 15s
      timeout: 5s
      retries: 8
    restart: unless-stopped
    mem_limit: 96m
    cpus: 0.25
networks:
  internal:
    internal: true
  proxy:
    external: true
    name: ${HML_PROXY_NETWORK:-n8n-traefik_app_network}
volumes:
  modulos_hml_data:
