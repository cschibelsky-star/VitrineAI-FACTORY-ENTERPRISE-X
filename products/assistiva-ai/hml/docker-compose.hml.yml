services:
  web:
    image: nginx:stable-alpine
    container_name: projeto_lucas_hml_web
    restart: unless-stopped
    ports:
      - "127.0.0.1:18897:80"
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health | grep -q ok"]
      interval: 30s
      timeout: 5s
      retries: 3
  api:
    build: ./api
    container_name: projeto_lucas_hml_api
    restart: unless-stopped
    env_file:
      - path: /srv/projects/projeto-lucas/.env.runtime
        required: false
    environment:
      PUBLIC_ORIGIN: https://lucas.hml.vitrineiapro.com.br
      DATA_DIR: /data
    volumes:
      - health-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
volumes:
  health-data:
