server {
    listen 80;
    server_name assessorgovia.com.br www.assessorgovia.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://assessorgovia.com.br$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name assessorgovia.com.br www.assessorgovia.com.br;

    ssl_certificate /etc/letsencrypt/live/assessorgovia.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/assessorgovia.com.br/privkey.pem;

    client_max_body_size 25m;

    location / {
        proxy_pass http://assessorgov_app:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
