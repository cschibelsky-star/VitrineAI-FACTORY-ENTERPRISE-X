name: Projeto Lucas Android

on:
  workflow_dispatch:
  push:
    branches:
      - feature/assistiva-ai-mvp
    paths:
      - 'products/assistiva-ai/**'
      - '.github/workflows/projeto-lucas-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: products/assistiva-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build tablet APK
        run: gradle :tablet-app:assembleDebug --stacktrace
      - name: Build Wear OS APK
        run: gradle :wear-app:assembleDebug --stacktrace
      - name: Upload tablet APK
        uses: actions/upload-artifact@v4
        with:
          name: projeto-lucas-tablet-apk
          path: products/assistiva-ai/tablet-app/build/outputs/apk/debug/tablet-app-debug.apk
      - name: Upload Wear OS APK
        uses: actions/upload-artifact@v4
        with:
          name: projeto-lucas-wear-apk
          path: products/assistiva-ai/wear-app/build/outputs/apk/debug/wear-app-debug.apk
